<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring Glow -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="4" opacity="0.3" filter="url(#glow)"/>

  <!-- Shield Shape -->
  <path d="M256 80 L390 140 C390 280 256 390 256 420 C256 390 122 280 122 140 Z" fill="url(#shieldGrad)" />

  <!-- Inner Checkmark & Star Icon -->
  <path d="M200 250 L240 290 L320 190" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Stars of Excellence -->
  <circle cx="256" cy="350" r="10" fill="#fbbf24" />
  <circle cx="216" cy="340" r="7" fill="#fbbf24" opacity="0.8" />
  <circle cx="296" cy="340" r="7" fill="#fbbf24" opacity="0.8" />

  <!-- Top Text (SKM) -->
  <text x="256" y="470" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="4">SIJENGGUNG</text>
</svg>
